interface:
  display_name: "Balise — Conformité juridique web"
  short_description: "Préparation juridique web multi-juridiction"
  default_prompt: "Utilise $balise-web-legal. Commence obligatoirement par son questionnaire de cadrage sans auditer ni rédiger, sauf si je t'autorise explicitement à le remplir avec les informations déjà connues. Détermine ensuite les juridictions applicables, utilise les skills spécialisés pertinents s'ils sont disponibles et poursuis de façon autonome s'ils ne le sont pas. Prépare l'audit ou les documents sans présenter le résultat comme une certification de conformité."
